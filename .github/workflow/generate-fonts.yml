name: Generate font list
on:
  push:
    branches: ["**"]
    paths:
      - "assets/fonts/**"
      - "scripts/generate-fonts.py"
      - ".github/workflows/generate-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-font-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install font metadata reader
        run: pip install fonttools
      - name: Generate fonts.json
        run: python scripts/generate-fonts.py
      - name: Commit updated font list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts/fonts.json
          if git diff --cached --quiet; then
            echo "Font list sudah terbaru."
          else
            git commit -m "chore: update automatic font list"
            git push
          fi
