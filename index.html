<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000"><meta name="description" content="PWA lokal untuk mengolah bahan sumber menjadi Master Stock / MSTSTK.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="assets/icon.png"><link rel="apple-touch-icon" href="assets/icon.png"><link rel="stylesheet" href="styles.css">
  <title>Inventory</title>
</head>
<body>
<header class="topbar"><img class="brand-logo" src="./assets/icon.png" alt="Logo Inventory"><div><div class="eyebrow">TOOLS OPERASIONAL</div><h1>Inventory</h1></div><span class="version">v1.2.0</span></header>
<main>
  <section class="hero card"><div class="hero-copy"><span class="pill">PWA · Pemrosesan lokal</span><h2>Bangun Data lebih praktis.</h2></div><div class="hero-icon" aria-hidden="true">⇩<span>CSV</span></div></section>
  <section class="card"><div class="section-heading"><div><span class="step">01</span><h2>Upload bahan</h2></div><button id="clearBtn" class="button button-quiet" type="button">Bersihkan</button></div>
    <label class="dropzone" id="dropzone"><input id="filePicker" type="file" multiple accept=".csv,.txt"><span class="upload-icon">＋</span><strong>Pilih banyak file CSV</strong><span>atau tarik file ke area ini</span><small>Nama file boleh mengikuti tanggal export masing-masing.</small></label>
    <div class="file-list-tools"><span id="fileCount" class="file-count">Belum ada file</span><button id="listToggle" class="button button-quiet hidden" type="button" aria-expanded="true">Minimalkan daftar ▲</button></div><div id="fileList" class="file-list"><div class="empty-state">Belum ada file yang dipilih.</div></div>
  </section>
  <section class="card process-card"><button id="processBtn" class="button button-primary button-wide" type="button">Proses MSTSTK</button><div id="status" class="status" role="status" aria-live="polite"></div></section>
  <section id="results" class="card hidden"><div class="section-heading"><div><span class="step">03</span><h2>Hasil proses</h2></div><span id="resultBadge" class="pill success">Selesai</span></div><div id="summary" class="summary-grid"></div><div id="warnings" class="warnings"></div><div class="download-actions"><button id="downloadBtn" class="button button-primary" type="button">Unduh MASTER STOCK.xlsx</button><button id="stockOutBtn" class="button button-secondary" type="button">Unduh Stock Out DC.xlsx</button><button id="logBtn" class="button button-secondary" type="button">Unduh log proses</button></div></section>
  <footer class="app-footer">Zie Project • Inventory v.1.1.1 @2026</footer>
</main><script src="vendor/jszip.min.js"></script><script src="app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body></html>
