<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#064a91"><meta name="description" content="PWA lokal untuk mengolah bahan sumber menjadi Master Stock / MSTSTK.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="assets/icon.png"><link rel="apple-touch-icon" href="assets/icon.png"><link rel="stylesheet" href="styles.css">
  <title>Inventory</title>
</head>
<body>
<header class="topbar"><img class="brand-logo" src="./assets/icon.png" alt="Logo Inventory"><div><div class="eyebrow">TOOLS OPERASIONAL</div><h1>Inventory</h1></div><span class="version">v1.9.3</span></header>
<main>
  <section class="card process-card" id="processCard"><div class="action-grid">
    <div class="process-item"><button id="masterBtn" class="button action-button action-master" type="button"><span class="action-copy"><strong>MASTER STOCK</strong></span></button><button class="required-link" data-requirements="masterBtn" type="button">File yang diperlukan</button></div>
    <div class="process-item"><button id="stockOutBtn" class="button action-button action-stockout" type="button"><span class="action-copy"><strong>STOCK OUT</strong></span></button><button class="required-link" data-requirements="stockOutBtn" type="button">File yang diperlukan</button></div>
    <div class="process-item"><button id="slSupplierBtn" class="button action-button action-stockout" type="button"><span class="action-copy"><strong>SL SUPPLIER</strong></span></button><button class="required-link" data-requirements="slSupplierBtn" type="button">File yang diperlukan</button></div>
    <div class="process-item"><button id="rekapSupplierBtn" class="button action-button action-stockout" type="button"><span class="action-copy"><strong>BPB SUPPLIER</strong></span></button><button class="required-link" data-requirements="rekapSupplierBtn" type="button">File yang diperlukan</button></div>
    <div class="process-item"><button id="brdBtn" class="button action-button action-brd" type="button"><span class="action-copy"><strong>BRD</strong></span></button><button class="required-link" data-requirements="brdBtn" type="button">File yang diperlukan</button></div>
  </div><div id="status" class="status" role="status" aria-live="polite"></div></section>
  <dialog id="fileManageDialog" class="brd-dialog file-manage-dialog"><form method="dialog"><h2 id="fileManageTitle">File yang diperlukan</h2><p id="fileManageIntro">Status file untuk proses ini.</p><div id="fileManageList" class="file-manage-list"></div><div class="upload-choices modal-upload-choices"><button id="pickDailyFolderLink" class="upload-choice upload-choice-folder" type="button">➕ Pilih Folder</button><button id="pickFilesButton" class="upload-choice upload-choice-files" type="button">➕ Pilih File</button></div><div class="file-manage-tools"><span id="fileManageCount"></span></div><div class="brd-dialog-actions file-manage-actions"><button id="clearBtn" class="button button-quiet" type="button">Bersihkan Semua</button><button type="button" class="button button-quiet" id="fileManageClose">Tutup</button></div></form></dialog>
  <input id="filePicker" type="file" multiple accept=".csv,.txt,.brd,.xlsx" hidden><input id="dailyFolderPicker" type="file" webkitdirectory directory multiple hidden>
  <dialog id="brdExportDialog" class="brd-dialog">
    <form method="dialog" id="brdExportForm">
      <h2>Pilih file BRD yang ingin diekspor</h2>
      <p>Pilih hanya jenis file yang diperlukan.</p>
      <label class="brd-option brd-all"><input type="checkbox" id="brdSelectAll"> Pilih semua</label>
      <div class="brd-options">
        <label class="brd-option"><input type="checkbox" name="brdExport" value="brd"> BRD.DBF</label>
        <label class="brd-option"><input type="checkbox" name="brdExport" value="csv"> BRD.CSV</label>
        <label class="brd-option"><input type="checkbox" name="brdExport" value="mstg_or_mstxh"> MSTG / MSTXH.DBF</label>
        <label class="brd-option"><input type="checkbox" name="brdExport" value="alokasi"> NPB.CSV (Alokasi)</label>
        <label class="brd-option"><input type="checkbox" name="brdExport" value="bpb"> BPB.CSV</label>
        <label class="brd-option"><input type="checkbox" name="brdExport" value="npb"> Detail NPB.CSV</label>
      </div>
      <div class="brd-dialog-actions"><button type="button" class="button button-quiet" id="brdCancel">Batal</button><button type="submit" class="button button-primary" id="brdExportSubmit">Ekspor pilihan</button></div>
      <div class="status" id="brdDialogError" role="alert"></div>
    </form>
  </dialog>
  <dialog id="preflightDialog" class="brd-dialog preflight-dialog">
    <form method="dialog">
      <h2 id="preflightTitle">File sumber belum lengkap</h2>
      <p id="preflightIntro">Periksa file yang belum tersedia.</p>
      <div id="preflightMissing" class="preflight-missing"></div>
      <div class="brd-dialog-actions preflight-actions">
        <button type="button" class="button button-quiet" id="preflightCancel">Batal</button>
        <button type="button" class="button button-primary" id="preflightComplete">Lengkapi</button>
        <button type="button" class="button button-primary" id="preflightProceed">Tetap Proses</button>
      </div>
    </form>
  </dialog>
  <iframe id="brdEngine" src="brd/engine.html" title="BRD conversion engine" aria-hidden="true" style="display:none;width:0;height:0;border:0"></iframe>
  <footer class="app-footer">Zie Project • Inventory v1.9.3 @2026</footer>
</main><script src="vendor/jszip.min.js"></script><script src="app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body></html>
